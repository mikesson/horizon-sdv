# High-Performance Sandbox overrides for Standalone ABFS deployment
# Configured for upgraded n4-standard-16 (16 vCPU, 64 GiB RAM) GKE nodes with Autoscaling.

# Gate server/uploaders/bootstrap on the licensed node pool existing
licensed: true

# GCP Project ID
projectId: hrzn-deploy-abfs-standalone-1

# Spanner Instance & Database configurations (must match KCC names)
spanner:
  instance: abfs
  database: abfs

# GCS blob storage bucket name (must match KCC name)
bucket: hrzn-deploy-abfs-standalone-1-abfs-blobs

# ABFS Server Resource Scaling (Full production-grade allocation)
server:
  resources:
    requests:
      cpu: "8"
      memory: 32Gi
    limits:
      memory: 32Gi

# ABFS Uploader Resource & Replica Scaling (Full production-grade allocation)
uploader:
  # 3 concurrent uploader streams for high-speed seeding
  count: 3
  resources:
    requests:
      cpu: "8"
      memory: 32Gi
    limits:
      memory: 64Gi  # Raised memory limit to 64Gi prevents OOM indexing recycles on AOSP
  dataDisk:
    # 270 GiB matches sandbox quotas perfectly
    size: 270Gi
    storageClass: hyperdisk-balanced

# ============================ PUSHER CONFIG ==================================
pusher:
  manifestProjectUrl: https://android.googlesource.com/platform/manifest
  branchFiles:
    - branch: main
      file: default.xml
    - branch: android-14.0.0_r1
      file: default.xml
    - branch: android-14.0.0_r2
      file: default.xml


