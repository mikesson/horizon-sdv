# High-Performance Sandbox overrides for Standalone ABFS deployment
# Configured for upgraded n4-highmem-32 GKE nodes with Autoscaling.

# Gate server/uploaders/bootstrap on the licensed node pool existing
licensed: true

# GCP Project ID
projectId: YOUR_PROJECT_ID

# Spanner Instance & Database configurations (must match KCC names)
spanner:
  instance: abfs
  database: abfs

# GCS blob storage bucket name (must match KCC name)
bucket: YOUR_PROJECT_ID-abfs-blobs

# ABFS Server Resource Scaling
server:
  resources:
    # HIGH PERFORMANCE SEEDING OPTION (Requires n2-highmem-80 or larger nodes to fit K8s allocatable overhead):
    # requests:
    #   cpu: "64"
    #   memory: 512Gi
    # limits:
    #   memory: 512Gi
    requests:
      cpu: "8"
      memory: 100Gi
    limits:
      memory: 100Gi

# ABFS Uploader Resource & Replica Scaling (Full production-grade allocation)
# Note: The 192Gi memory request mathematically guarantees 1 uploader per n4-highmem-32 VM (Result = 3 VMs total)
uploader:
  # 3 concurrent uploader streams for high-speed seeding
  count: 3
  resources:
    # HIGH PERFORMANCE SEEDING OPTION (Requires n2-highmem-80 or larger nodes to fit K8s allocatable overhead):
    # requests:
    #   cpu: "48"
    #   memory: 192Gi
    # limits:
    #   memory: 192Gi
    requests:
      cpu: "16"
      memory: 192Gi
    limits:
      memory: 192Gi  # Guaranteed QoS: Mathematically reserves the entire node for this uploader
  dataDisk:
    size: 1500Gi
    storageClass: hyperdisk-balanced

# ============================ PUSHER CONFIG ==================================
pusher:
  manifestProjectUrl: https://android.googlesource.com/platform/manifest
  # --- FULL PRODUCTION CONFIG (Commented out for sandbox testing) ---
  # branchFiles:
  #   - branch: main
  #     file: default.xml
  #   - branch: android-16.0.0_r4
  #     file: default.xml

  # --- FAST SANDBOX TESTING CONFIG ---
  # Limit the sync strictly to android-16.0.0_r4 to speed up testing
  branchFiles:
    - branch: android-16.0.0_r4
      file: default.xml
  fetchRefSpec:
    - +refs/tags/android-16.0.0_r4:refs/tags/android-16.0.0_r4

vpa:
  enabled: true
  updateMode: "Off"
