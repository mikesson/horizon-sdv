apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/setup

configMapGenerator:
  - name: setup-project-config
    envs:
      - project.env

replacements:
  - source:
      kind: ConfigMap
      name: setup-project-config
      fieldPath: data.KCC_SERVICE_ACCOUNT
    targets:
      - select:
          kind: ConfigConnector
          name: configconnector.core.cnrm.cloud.google.com
        fieldPaths:
          - spec.googleServiceAccount
  - source:
      kind: ConfigMap
      name: setup-project-config
      fieldPath: data.PROJECT_ID
    targets:
      - select:
          kind: Namespace
          name: abfs
        fieldPaths:
          - metadata.annotations.[cnrm.cloud.google.com/project-id]
