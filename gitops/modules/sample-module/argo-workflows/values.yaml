# Namespace where WorkflowTemplates and submitted Workflows run (must match Argo Workflows controller.workflowNamespaces).
workflowNamespace: workflows

# Namespace where Argo Events Sensors are installed (must match EventSource/EventBus from platform argo-events).
eventsNamespace: argo-events

# sample-soft WorkflowTemplate ref (parent Application sets from softFeaturesEnabled).
referenceSampleSoftWorkflowTemplate: false

# GCS upload stage when sample lists storage-gcs and sample-data as enabled soft dependencies.
# templateRef storage-gcs-upload; bucket is caller-supplied (sample-data owned name).
referenceGcsEnabled: false

# Default GCS bucket for smoke uploads (parent Application sets to sample-data's bucket: {projectID}-sample-workloads-data).
sampleWorkloadsDataBucket: ""
