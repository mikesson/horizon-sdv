moduleName: cuttlefish-orchestrator
workflowNamespace: workflows
eventsNamespace: argo-events
ccoNamespace: cuttlefish-orchestrator
ccoApiUrl: "http://cuttlefish-orchestrator-api.cuttlefish-orchestrator.svc.cluster.local:8080"

workflowImage: "example/cuttlefish-workflow:latest"
networkPolicies: true
cloudEnvConfigMapName: "horizon-workflow-cloud-env"

projectId: ""
region: "europe-west1"
zone: "europe-west1-d"
network: "sdv-network"
subnetwork: "sdv-subnet"

arm64Region: ""
arm64Zone: ""
arm64Subnetwork: ""

artifactsBucket: ""
aaosBucket: ""
hostImageProject: ""

serviceAccountWorkflow: "workflow-executor"
serviceAccountElevated: "workflow-executor-elevated"
serviceAccountSensor: "sensor-submit-workflow"

podGcStrategy: "OnWorkflowCompletion"
workflowTtlSecondsAfterCompletion: 86400
ctsWorkspaceStorageSize: "40Gi"

ctsRunner:
  nodeSelector:
    workloadLabel: utility
  tolerations:
    - key: workloadType
      operator: Equal
      value: utility
      effect: NoSchedule
