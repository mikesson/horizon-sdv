{{- if .Values.networkPolicies }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workflow-pods-egress-to-cco-api
  namespace: {{ .Values.workflowNamespace | quote }}
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  podSelector:
    matchExpressions:
      - key: workflows.argoproj.io/workflow
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ccoNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cuttlefish-orchestrator-api
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
