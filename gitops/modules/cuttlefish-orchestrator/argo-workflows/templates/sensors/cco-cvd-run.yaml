{{- $root := . }}
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-cco-cvd-run
  namespace: {{ $root.Values.eventsNamespace | quote }}
  labels:
    horizon-sdv.io/module: {{ $root.Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  eventBusName: default
  template:
    serviceAccountName: {{ $root.Values.serviceAccountSensor | quote }}
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            value:
              - "cco-cvd-run"
  triggers:
    - template:
        name: submit-cco-cvd-run
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: webhook-cco-cvd-run-
                namespace: {{ $root.Values.workflowNamespace | quote }}
              spec:
                serviceAccountName: {{ $root.Values.serviceAccountWorkflow | quote }}
                workflowTemplateRef:
                  name: cco-cvd-run
                arguments:
                  parameters:
                    - name: horizonSubmittedFrom
                    - name: submittedBy
                    - name: deviceName
                    - name: architecture
                    - name: pool
                    - name: interaction
                    - name: gpuMode
                    - name: capacity
                    - name: instances
                    - name: buildId
                    - name: buildTarget
                    - name: buildBranch
                    - name: defaultBuildUrl
                    - name: hostPackageUrl
                    - name: adbShellCommand
                    - name: bootTimeoutSeconds
                    - name: keepDevice
                    - name: bugreportDestination
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: metadata.labels.horizon-sdv\.io/submitted-from
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.deviceName
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.architecture
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.pool
              dest: spec.arguments.parameters.4.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.interaction
              dest: spec.arguments.parameters.5.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.gpuMode
              dest: spec.arguments.parameters.6.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.capacity
              dest: spec.arguments.parameters.7.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.instances
              dest: spec.arguments.parameters.8.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.buildId
              dest: spec.arguments.parameters.9.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.buildTarget
              dest: spec.arguments.parameters.10.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.buildBranch
              dest: spec.arguments.parameters.11.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.defaultBuildUrl
              dest: spec.arguments.parameters.12.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.hostPackageUrl
              dest: spec.arguments.parameters.13.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.adbShellCommand
              dest: spec.arguments.parameters.14.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.bootTimeoutSeconds
              dest: spec.arguments.parameters.15.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.keepDevice
              dest: spec.arguments.parameters.16.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.bugreportDestination
              dest: spec.arguments.parameters.17.value
