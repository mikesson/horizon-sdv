{{ $pfx := include "cco.prefix" . -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cuttlefish-console-oauth2-proxy-creds
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cuttlefish-console-oauth2-proxy
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: cco-secret-store
  target:
    name: cuttlefish-console-oauth2-proxy-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        client-id: cuttlefish-orchestrator
        client-secret: '{{ "{{ .client_secret }}" }}'
        cookie-secret: '{{ "{{ .cookie_secret }}" }}'
  data:
    - secretKey: client_secret
      remoteRef:
        key: {{ printf "%scuttlefish-orchestrator-oidc-client-secret-b64" $pfx | quote }}
        decodingStrategy: Base64
    - secretKey: cookie_secret
      remoteRef:
        key: {{ printf "%scuttlefish-orchestrator-oauth2-cookie-secret-b64" $pfx | quote }}
        decodingStrategy: Base64
