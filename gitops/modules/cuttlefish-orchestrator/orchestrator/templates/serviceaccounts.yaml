{{ $gcpSA := include "cco.gcpServiceAccount" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cuttlefish-orchestrator-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cuttlefish-orchestrator-api
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    iam.gke.io/gcp-service-account: {{ $gcpSA | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cco-spanner-seed
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cco-spanner-seed
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    iam.gke.io/gcp-service-account: {{ $gcpSA | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cco-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cco-cleanup
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    iam.gke.io/gcp-service-account: {{ $gcpSA | quote }}
---
# Unannotated Direct Workload Identity KSA bound strictly to ESO Secret Manager
# access for OIDC/OAuth2 proxy secrets (s20/s21).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cuttlefish-orchestrator-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cuttlefish-orchestrator-sa
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
