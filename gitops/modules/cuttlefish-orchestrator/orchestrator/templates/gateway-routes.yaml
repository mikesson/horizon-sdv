{{ $pfx := include "cco.prefix" . -}}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: cuttlefish-orchestrator-route
  namespace: {{ .Release.Namespace }}
  labels:
    gateway: gke-gateway
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  parentRefs:
    - kind: Gateway
      name: gke-gateway
      namespace: {{ printf "%sgke-gateway" $pfx }}
      sectionName: https
  hostnames:
    - {{ .Values.config.domain | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /cuttlefish-orchestrator
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /cuttlefish-orchestrator/
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /cuttlefish-orchestrator/
      backendRefs:
        - name: cuttlefish-console-oauth2-proxy
          port: 80
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: cuttlefish-orchestrator-healthcheck
  namespace: {{ .Release.Namespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 15
    healthyThreshold: 1
    unhealthyThreshold: 2
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /ping
        host: {{ .Values.config.domain | quote }}
  targetRef:
    group: ""
    kind: Service
    name: cuttlefish-console-oauth2-proxy
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: cuttlefish-orchestrator-backend-policy
  namespace: {{ .Release.Namespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  default:
    timeoutSec: 86400
  targetRef:
    group: ""
    kind: Service
    name: cuttlefish-console-oauth2-proxy
