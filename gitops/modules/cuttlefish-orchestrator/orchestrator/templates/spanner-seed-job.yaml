apiVersion: batch/v1
kind: Job
metadata:
  name: cco-spanner-seed
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cco-spanner-seed
    app.kubernetes.io/component: spanner-seed
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cco-spanner-seed
        app.kubernetes.io/component: spanner-seed
        horizon-sdv.io/module: {{ .Values.moduleName | quote }}
    spec:
      serviceAccountName: cco-spanner-seed
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spanner-seed
          image: {{ .Values.spannerSeedImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: CLOUDSDK_CONFIG
              value: /tmp/gcloud
            - name: GCE_METADATA_HOST
              value: "169.254.169.252:988"
            - name: PROJECT_ID
              value: {{ .Values.config.projectID | quote }}
            - name: INSTANCE_ID
              value: {{ include "cco.spannerInstanceId" . | quote }}
            - name: DATABASE_ID
              value: {{ include "cco.spannerDatabaseId" . | quote }}
{{- $seedDefaultZone := true -}}
{{- if and .Values.spanner (hasKey .Values.spanner "seedDefaultZone") -}}
{{- $seedDefaultZone = .Values.spanner.seedDefaultZone -}}
{{- end -}}
{{- if and $seedDefaultZone .Values.config.zone }}
            - name: DEFAULT_ZONE
              value: {{ .Values.config.zone | quote }}
{{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail

              ready=0
              for i in $(seq 1 60); do
                if gcloud spanner databases execute-sql "${DATABASE_ID}" \
                    --instance="${INSTANCE_ID}" \
                    --project="${PROJECT_ID}" \
                    --sql="SELECT 1 FROM system_config LIMIT 1" >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                echo "Waiting for Spanner database ${INSTANCE_ID}/${DATABASE_ID} schema readiness (${i}/60)..."
                sleep 5
              done

              if [ "${ready}" -ne 1 ]; then
                echo "ERROR: Spanner database ${INSTANCE_ID}/${DATABASE_ID} did not become ready in time." >&2
                exit 1
              fi

              run_dml() {
                gcloud spanner databases execute-sql "${DATABASE_ID}" \
                  --instance="${INSTANCE_ID}" \
                  --project="${PROJECT_ID}" \
                  --sql="$1" >/dev/null
              }

              run_dml "INSERT OR IGNORE INTO system_config (config_key, config_value, description) VALUES ('schema.version', '87', 'Schema version this database holds, checked by the binary before it serves')"
              run_dml "INSERT OR IGNORE INTO system_config (config_key, config_value, description) VALUES ('build.default_upstream_branch', 'aosp-android-latest-release', 'AOSP branch used when a declarative device create finds no registered builds')"
              run_dml "INSERT OR IGNORE INTO system_config (config_key, config_value, description) VALUES ('build.default_upstream_target', 'aosp_cf_x86_64_only_phone-userdebug', 'AOSP build target paired with build.default_upstream_branch')"
              run_dml "INSERT OR IGNORE INTO quotas (scope, scope_id, max_hosts, used_hosts) VALUES ('platform', 'global', 100, 0)"
              run_dml "INSERT OR IGNORE INTO machine_families (family, name, description, category, architecture, cpu_type, boot_disk_type, gpu_mode, max_gpus, default_gpu_type, default_gpu_count, is_enabled, sort_order) VALUES ('n1', 'N1 General Purpose', 'General-purpose, GPU-capable', 'general_purpose', 'x86', 'Intel Skylake/Broadwell/Haswell', 'pd-balanced', 'attachable', 4, 'nvidia-tesla-t4', 0, true, 100), ('n2', 'N2 General Purpose', 'General-purpose, CPU-only', 'general_purpose', 'x86', 'Intel Cascade Lake/Ice Lake', 'pd-balanced', 'none', NULL, NULL, NULL, true, 110), ('n4', 'N4 General Purpose', 'General-purpose, CPU-only', 'general_purpose', 'x86', 'Intel Emerald Rapids', 'hyperdisk-balanced', 'none', NULL, NULL, NULL, true, 120), ('c3', 'C3 Compute Optimized', 'Compute-optimized, CPU-only', 'compute_optimized', 'x86', 'Intel Sapphire Rapids', 'pd-balanced', 'none', NULL, NULL, NULL, true, 200), ('c4', 'C4 Compute Optimized', 'Compute-optimized, CPU-only', 'compute_optimized', 'x86', 'Intel Emerald Rapids', 'hyperdisk-balanced', 'none', NULL, NULL, NULL, true, 210), ('g2', 'G2 GPU (L4)', 'GPU optimized with L4', 'accelerator_optimized', 'x86', 'Intel Cascade Lake', 'pd-balanced', 'none', NULL, NULL, NULL, true, 400), ('c4a', 'C4A ARM Compute Optimized', 'ARM, bare metal only. Required for ARM-based Cuttlefish devices. Powered by Google Axion processors.', 'compute_optimized', 'arm', 'Google Axion', 'hyperdisk-balanced', 'none', NULL, NULL, NULL, true, 420)"
              run_dml "INSERT OR IGNORE INTO machine_type_overrides (machine_type, is_default) VALUES ('n1-standard-8', true)"
              run_dml "INSERT OR IGNORE INTO host_image_configs (machine_family, image_family, source_project, description, enabled, created_by, updated_by) VALUES ('n1', 'cco-host', NULL, 'Intel Haswell/Skylake general purpose', true, 'schema-seed', 'schema-seed'), ('n2', 'cco-host', NULL, 'Intel Cascade Lake general purpose', true, 'schema-seed', 'schema-seed'), ('n4', 'cco-host', NULL, 'Intel Emerald Rapids general purpose', true, 'schema-seed', 'schema-seed'), ('c3', 'cco-host', NULL, 'Intel Sapphire Rapids compute-optimized', true, 'schema-seed', 'schema-seed'), ('c4', 'cco-host', NULL, 'Intel Emerald Rapids compute-optimized', true, 'schema-seed', 'schema-seed'), ('g2', 'cco-host', NULL, 'NVIDIA L4 GPU instances', true, 'schema-seed', 'schema-seed'), ('c4a', 'cco-host', NULL, 'Google Axion ARM processors (bare metal only)', true, 'schema-seed', 'schema-seed')"

              if [ -n "${DEFAULT_ZONE:-}" ]; then
                if [[ ! "${DEFAULT_ZONE}" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+){2,}$ ]]; then
                  echo "ERROR: Invalid DEFAULT_ZONE=${DEFAULT_ZONE}; expected GCP zone matching ^[a-z][a-z0-9]*(-[a-z0-9]+){2,}$." >&2
                  exit 1
                fi
                run_dml "INSERT OR IGNORE INTO system_config (config_key, config_value, description) VALUES ('zones.enabled', '[\"${DEFAULT_ZONE}\"]', 'Initial enabled zone seeded from Horizon config.zone')"
              fi

              echo "Spanner seed completed for ${INSTANCE_ID}/${DATABASE_ID}."
      volumes:
        - name: tmp
          emptyDir: {}
