apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuttlefish-console
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cuttlefish-console
    app.kubernetes.io/component: console
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cuttlefish-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cuttlefish-console
        app.kubernetes.io/component: console
        horizon-sdv.io/module: {{ .Values.moduleName | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: {{ include "cco.consoleImage" . | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: API_UPSTREAM
              value: "cuttlefish-orchestrator-api:8080"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: proxy-common
              mountPath: /etc/nginx/snippets/proxy-common.conf
              subPath: proxy-common.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: proxy-common
          configMap:
            name: cuttlefish-console-proxy-common
