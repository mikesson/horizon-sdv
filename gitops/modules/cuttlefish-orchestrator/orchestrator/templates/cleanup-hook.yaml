# Suspended CronJob template instantiated by module-manager during module disable
# (after module-manager scales cuttlefish-orchestrator-api to zero and waits for
# API pods to exit). Argo CD has no PreDelete hook type, so suspend=true ensures
# Kubernetes never runs this cleanup automatically during enable or normal sync.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cco-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cco-cleanup
    app.kubernetes.io/component: cleanup
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: cco-cleanup
        app.kubernetes.io/component: cleanup
        horizon-sdv.io/module: {{ .Values.moduleName | quote }}
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cco-cleanup
            app.kubernetes.io/component: cleanup
            horizon-sdv.io/module: {{ .Values.moduleName | quote }}
        spec:
          serviceAccountName: cco-cleanup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: {{ .Values.cloudSdkImage | default .Values.spannerSeedImage | quote }}
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: HOME
                  value: /tmp
                - name: CLOUDSDK_CONFIG
                  value: /tmp/gcloud
                - name: GCE_METADATA_HOST
                  value: "169.254.169.252:988"
                - name: PROJECT_ID
                  value: {{ .Values.config.projectID | quote }}
                - name: CCO_DEPLOYMENT
                  value: {{ include "cco.deployment" . | quote }}
                - name: CCO_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail

                  filter="labels.managed-by=cloud-cuttlefish-orchestrator AND labels.cco-deployment=${CCO_DEPLOYMENT} AND name:cf-*"
                  empty_streak=0
                  iteration=0
                  max_iterations=30
                  list_failures=0
                  max_list_failures=5

                  while [ "${empty_streak}" -lt 2 ] && [ "${iteration}" -lt "${max_iterations}" ]; do
                    iteration=$((iteration + 1))
                    if ! instances="$(gcloud compute instances list \
                        --project="${PROJECT_ID}" \
                        --filter="${filter}" \
                        --format="value(name,zone)")"; then
                      list_failures=$((list_failures + 1))
                      empty_streak=0
                      echo "WARN: gcloud compute instances list failed (${list_failures}/${max_list_failures}); retrying..." >&2
                      if [ "${list_failures}" -ge "${max_list_failures}" ]; then
                        echo "ERROR: Repeated failures listing managed Cuttlefish host VMs." >&2
                        exit 1
                      fi
                      sleep 10
                      continue
                    fi
                    list_failures=0

                    if [ -z "${instances}" ]; then
                      empty_streak=$((empty_streak + 1))
                      echo "No managed Cuttlefish host VMs found (consecutive check ${empty_streak}/2)."
                      if [ "${empty_streak}" -lt 2 ]; then
                        sleep 15
                      fi
                      continue
                    fi

                    empty_streak=0
                    while IFS=$'\t' read -r name zone_val; do
                      [ -z "${name}" ] && continue
                      zone="${zone_val##*/}"
                      echo "Deleting managed Cuttlefish host VM ${name} in ${zone}..."
                      gcloud compute instances delete "${name}" \
                        --project="${PROJECT_ID}" \
                        --zone="${zone}" \
                        --delete-disks=all \
                        --quiet || echo "WARN: Failed to delete ${name} in ${zone}; will re-verify." >&2
                    done <<< "${instances}"
                    sleep 10
                  done

                  if [ "${empty_streak}" -lt 2 ]; then
                    echo "ERROR: Timed out waiting for managed Cuttlefish host VMs to drain." >&2
                    exit 1
                  fi

                  echo "Cleanup completed cleanly for deployment=${CCO_DEPLOYMENT}."
          volumes:
            - name: tmp
              emptyDir: {}
