apiVersion: spanner.cnrm.cloud.google.com/v1beta1
kind: SpannerInstance
metadata:
  name: {{ include "cco.spannerInstanceId" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cuttlefish-orchestrator
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cnrm.cloud.google.com/project-id: {{ .Values.config.projectID | quote }}
    cnrm.cloud.google.com/deletion-policy: {{ (.Values.spanner).deletionPolicy | default "delete" | quote }}
spec:
  config: {{ printf "regional-%s" .Values.config.region | quote }}
  displayName: {{ include "cco.spannerDisplayName" . | quote }}
  processingUnits: {{ (.Values.spanner).processingUnits | default 100 }}
