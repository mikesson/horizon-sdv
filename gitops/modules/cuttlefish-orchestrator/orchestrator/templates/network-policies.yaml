{{- if .Values.config.enableNetworkPolicies }}
{{- $pfx := include "cco.prefix" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Release.Namespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .Release.Namespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: cuttlefish-console-oauth2-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 4180
        - protocol: TCP
          port: 44180
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cuttlefish-console
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ printf "%skeycloak" $pfx | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloakx
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cuttlefish-console
  namespace: {{ .Release.Namespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cuttlefish-console
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
              app.kubernetes.io/instance: cuttlefish-console-oauth2-proxy
      ports:
        - protocol: TCP
          port: 8080
    # Kubelet HTTP probes originate from node primary subnets onto isolated probe port :8081 only.
    - from:
{{- range (.Values.config.probeSourceCIDRs | default (list "10.1.0.0/24" "10.2.0.0/24")) }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cuttlefish-orchestrator-api
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cuttlefish-orchestrator-api
  namespace: {{ .Release.Namespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cuttlefish-orchestrator-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cuttlefish-console
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ printf "%sworkflows" $pfx | quote }}
          podSelector:
            matchLabels:
              horizon-sdv.io/cuttlefish-api-client: "true"
      ports:
        - protocol: TCP
          port: 8080
    # Kubelet HTTP probes originate from node primary subnets onto isolated probe port :8081 only.
    - from:
{{- range (.Values.config.probeSourceCIDRs | default (list "10.1.0.0/24" "10.2.0.0/24")) }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 1080
        - protocol: TCP
          port: 2080
        - protocol: TCP
          port: 2081
---
apiVersion: networking.k8s.io/v1
