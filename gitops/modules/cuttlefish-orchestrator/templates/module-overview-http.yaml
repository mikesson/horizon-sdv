{{ $overviewNs := include "ccoParent.overviewNamespace" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.overviewServiceName }}-html
  namespace: {{ $overviewNs }}
  labels:
    app.kubernetes.io/name: module-overview
    app.kubernetes.io/component: module-overview-http
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
data:
  index.html: |-
{{ .Files.Get "portal/overview.html" | nindent 4 }}
  nginx.conf: |-
    pid /tmp/nginx.pid;
    worker_processes 1;
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      server {
        listen 8080;
        server_name _;
        location / {
          root /usr/share/nginx/html;
          index index.html;
          try_files $uri $uri/ /index.html;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.overviewServiceName }}
  namespace: {{ $overviewNs }}
  labels:
    app.kubernetes.io/name: module-overview
    app.kubernetes.io/component: module-overview-http
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: module-overview
      horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: module-overview
        app.kubernetes.io/component: module-overview-http
        horizon-sdv.io/module: {{ .Values.moduleName | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: {{ .Values.config.nginx.image }}:{{ .Values.config.nginx.tag }}
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-e", "/dev/stderr", "-g", "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: html
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: {{ .Values.overviewServiceName }}-html
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.overviewServiceName }}
  namespace: {{ $overviewNs }}
  labels:
    app.kubernetes.io/name: module-overview
    app.kubernetes.io/component: module-overview-http
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: module-overview
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  ports:
    - name: http
      port: 80
      targetPort: http
