# Child Application that deploys storage-gcs-module argo-workflows WorkflowTemplates.
# Lives in its own Application so Argo CD only validates WorkflowTemplate resources
# after the Argo Workflows CRDs are already installed on the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-argo-workflows
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.moduleName }}
    horizon-sdv.io/module: {{ .Values.moduleName }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/storage-gcs-module/argo-workflows
    helm:
      values: |
        workflowNamespace: {{ .Values.config.namespacePrefix }}workflows
        storageGcsModuleBaseUrl: https://storage-gcs-module.{{ .Values.config.namespacePrefix }}horizon.svc.cluster.local:8443
        apiTokenSecretName: {{ (.Values.config.apiToken).secretName | default "storage-gcs-module-api-token" | quote }}
        apiTokenSecretKey: {{ (.Values.config.apiToken).key | default "storage-gcs-internal" | quote }}
        apiTlsSecretName: storage-gcs-module-api-tls
        mainEnv: {{ not (default false .Values.config.isSubEnvironment) }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.config.namespacePrefix }}workflows
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
