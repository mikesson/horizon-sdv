{{- if include "storage-gcs-module.mainEnv" . | eq "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storage-gcs-module
  namespace: {{ .Values.config.namespacePrefix }}horizon
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - gcsmanager.horizon.io
    resources:
      - gcsbuckets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - gcsmanager.horizon.io
    resources:
      - gcsbuckets/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - storage-gcs-module-resumable
    verbs:
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
{{- end }}
