# Cloud Build configuration for the orchestrator image. Run it through
# scripts/build-image.sh, which supplies the substitutions, the region, the
# builder service account and the staging bucket.
#
# Schema reference: https://cloud.google.com/build/docs/build-config-file-schema

substitutions:
  # Full image path without a tag, REGION-docker.pkg.dev/PROJECT/REPOSITORY/IMAGE.
  _IMAGE: ''
  # The repository's tags are immutable, so every build needs a new one.
  _TAG: ${BUILD_ID:0:8}

steps:
  - id: 'check-image'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -z "${_IMAGE}" ]; then
          echo "_IMAGE is empty. Run scripts/build-image.sh, or pass --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/REPOSITORY/IMAGE" >&2
          exit 1
        fi

  - id: 'build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}:${_TAG}'
      - '.'

options:
  machineType: 'E2_HIGHCPU_8'
  # A build that runs as a user-chosen service account must log here only.
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

# Cloud Build pushes these after the steps and records each digest in the
# build's results.
images:
  - '${_IMAGE}:${_TAG}'

timeout: '900s'

tags:
  - 'cuttlefish-orchestrator'
