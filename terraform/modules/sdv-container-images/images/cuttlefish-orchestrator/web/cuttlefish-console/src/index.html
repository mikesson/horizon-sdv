<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Cloud Cuttlefish Orchestrator</title>
    <base href="/">
    <!-- A stored choice has to reach <html> before the first paint. Angular
         applies it too, but only once it has bootstrapped, by which point a
         stored Light on a dark operating system has already rendered dark.
         AppearanceService owns this key and this attribute; keep the two in
         step. No stored value means no attribute, which leaves the OS
         authoritative, the same rule the service follows for 'system'. -->
    <script>
      try {
        const stored = localStorage.getItem('cco-appearance');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-cco-theme', stored);
        }
      } catch {
        // Storage unavailable; the OS colour scheme still applies.
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Android virtual devices on Google Cloud Platform">
    <meta name="theme-color" content="#1a73e8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.svg">
</head>

<body class="mat-typography">
    <app-root></app-root>
</body>

</html>
