# Example GitHub Actions workflow using Workload Identity Federation
#
# This workflow demonstrates how to authenticate to Cloud Cuttlefish Orchestrator
# using Workload Identity Federation (WIF) for keyless, secure CI/CD access.
#
# Prerequisites:
# 1. Apply the WIF Terraform module (terraform/modules/wif) with
#    enable_github_provider = true
# 2. Put the CI service account on the IAP access list (the iap_members
#    Terraform variable) and grant it roles/iam.serviceAccountTokenCreator on
#    itself, so cfctl can sign the IAP JWT as that account
# 3. Configure the following GitHub Actions secrets/variables:
#    - CCO_WIF_PROVIDER: Workload Identity Provider resource name
#    - CCO_SERVICE_ACCOUNT: Service account email
#    - CCO_SERVER_URL: CCO server URL
#
# For detailed setup instructions, see: docs/guides/cicd-integration.md

name: CI/CD with CCO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# IMPORTANT: These permissions are required for WIF to work
permissions:
  id-token: write   # Required for requesting the OIDC JWT token
  contents: read    # Required for actions/checkout

env:
  # Configure these values for your environment
  # These can be set as repository variables or secrets
  CCO_WIF_PROVIDER: ${{ vars.CCO_WIF_PROVIDER }}
  CCO_SERVICE_ACCOUNT: ${{ vars.CCO_SERVICE_ACCOUNT }}

  # cfctl reads these directly, so a CI runner needs no config file. With no
  # audience set, cfctl signs a self-signed JWT as CFCTL_IMPERSONATE for the
  # built-in Cloud Run IAP. A deployment behind a custom IAP OAuth client sets
  # CFCTL_AUDIENCE to that client ID instead.
  CFCTL_SERVER: ${{ vars.CCO_SERVER_URL }}
  CFCTL_IMPERSONATE: ${{ vars.CCO_SERVICE_ACCOUNT }}

jobs:
  test:
    name: Run Tests with CCO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using WIF
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # The full identifier of the Workload Identity Provider
          # Format: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID
          workload_identity_provider: ${{ env.CCO_WIF_PROVIDER }}

          # The service account email to impersonate
          service_account: ${{ env.CCO_SERVICE_ACCOUNT }}

      # Install cfctl CLI
      - name: Install cfctl
        run: |
          # Download and install cfctl (replace with actual download URL)
          # For now, assume it's already built in the repository
          go install ./cmd/cfctl

      # Verify authentication
      - name: Verify CCO Authentication
        run: |
          cfctl auth whoami

      # Example: List devices
      - name: List Devices
        run: |
          cfctl device list --json

      # Example: Create a device for testing
      - name: Create Test Device
        id: create-device
        run: |
          # Create a device and capture the ID
          DEVICE_ID=$(cfctl device create \
            --host="${{ vars.CCO_HOST_ID }}" \
            --name="ci-test-${{ github.run_id }}" \
            --json | jq -r '.id')
          echo "device_id=${DEVICE_ID}" >> "$GITHUB_OUTPUT"

      # Run your tests here
      - name: Run Tests
        run: |
          echo "Running tests against device ${{ steps.create-device.outputs.device_id }}"
          # Your test commands here

      # Cleanup: Delete the test device
      - name: Cleanup Test Device
        if: always()
        run: |
          if [ -n "${{ steps.create-device.outputs.device_id }}" ]; then
            cfctl device delete "${{ steps.create-device.outputs.device_id }}" || true
          fi

  # Example job showing parallel device usage
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.CCO_WIF_PROVIDER }}
          service_account: ${{ env.CCO_SERVICE_ACCOUNT }}

      - name: Install cfctl
        run: go install ./cmd/cfctl

      - name: Run Integration Tests
        run: |
          echo "Integration tests would run here"
          cfctl device list

---
